[package]
name = "jsntrs"
version = "0.1.0"
edition = "2024"
# Floor derives from let-chains (stabilized 1.88); edition 2024 itself needs
# only 1.85. Older toolchains are not tested in CI.
rust-version = "1.88"
description = "JSONata 2.x query and transformation engine"
license = "MIT"
repository = "https://github.com/dkkloimwieder/jsntrs"
readme = "README.md"
keywords = ["jsonata", "json", "query", "transformation", "wasm"]
categories = ["parser-implementations", "wasm"]
# Only library sources ship to crates.io. The integration tests need
# testdata/ and the benches need bench/ data files, both at the repo root
# outside this package; bench sources are still included so the [[bench]]
# targets below remain valid.
include = [
    "src/**",
    "benches/**",
    "examples/**",
    "README.md",
    "LICENSE",
]

[lib]
crate-type = ["cdylib", "rlib"]
# Keep `cargo bench` off the libtest harness — criterion benches only.
bench = false

[dependencies]
# Regex backend — at least one must be enabled (regex wins if both are).
# The default `regex` feature uses the full crate (Unicode-complete, RE2
# semantics, same model as Go's regexp).
# The `regex-lite` feature shrinks WASM builds by ~700 KB (1.3 MB → 579 KB).
regex = { version = "1.12", optional = true }
regex-lite = { version = "0.1", optional = true }

# JSON parsing & serialization. simd-json parses input documents; serde_json
# provides arbitrary-precision numbers and ordered maps for output.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }
simd-json = { version = "0.17.0", features = ["serde_impl"] }

# Value internals: insertion-ordered object maps (invariant INV-KEY-ORDER)
# and inline small strings for keys and string values.
indexmap = "2"
compact_str = { version = "0.9.0", features = ["serde"] }

# Exact ECMAScript Number.toString() formatting (invariant INV-NUM-TOSTRING).
ryu-js = "1.0"

# Encoding builtins: $base64encode/$base64decode, $encodeUrl/$decodeUrl.
base64 = "0.22"
percent-encoding = "2.3"

# Non-crypto RNG for $random and $shuffle.
fastrand = "2"

# Heap profiling for the jsntrs-dhat bin only (feature: dhat-heap).
dhat = { version = "0.3", optional = true }
foldhash = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Segmented stack growth at recursion entry points (mirrors Go's growable
# goroutine stacks). WASM cannot grow its stack, so it is excluded there.
stacker = "0.1"
mimalloc = { version = "0.1", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[features]
default = ["mimalloc-alloc", "regex"]
# Full Unicode regex backend (recommended).
regex = ["dep:regex"]
# Lighter regex backend for smaller WASM builds.
regex-lite = ["dep:regex-lite"]
# Links mimalloc. It is installed as the global allocator only in the bundled
# jsntrs-bench binary — a library must not pick its consumer's allocator.
mimalloc-alloc = ["mimalloc"]
# Heap profiling instrumentation for the jsntrs-dhat bin (needs `internals`
# for `register_all`).
dhat-heap = ["dhat", "internals"]
# Build the jsntrs-bench CLI (repo benchmarking tool, not part of the library).
bench-bin = []
# Unstable internal re-exports (parser, lexer, eval hooks) for the in-repo
# tests, benches, fuzz targets, and profiling bin. Additive, but the items
# carry no stability guarantee — never enable in downstream code.
internals = []

[dev-dependencies]
# Self-dependency: turns on the internal re-exports for the integration
# tests and benches (which link jsntrs as an external crate) without
# affecting downstream builds.
jsntrs = { path = ".", default-features = false, features = ["internals"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.11.0"

# Repo tooling bins, gated behind features so `cargo install jsntrs` and
# `cargo publish --dry-run` never build them.
[[bin]]
name = "jsntrs-bench"
path = "src/bin/bench.rs"
required-features = ["bench-bin"]

[[bin]]
name = "jsntrs-dhat"
path = "src/bin/dhat_profile.rs"
required-features = ["dhat-heap"]

[[bench]]
name = "eval"
harness = false

[[bench]]
name = "parse"
harness = false

# [profile.*] lives in the workspace root Cargo.toml — cargo ignores profile
# sections in member manifests.
